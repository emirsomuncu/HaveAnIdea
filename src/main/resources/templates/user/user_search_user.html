<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Search Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        form {
            padding-top: 40px;
            max-width: 600px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            background-color: #f9f9f9;
        }

        button[type="submit"], .cancel-btn {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button[type="submit"]:hover, .cancel-btn:hover {
            background-color: #0056b3;
        }

        .user-section {
            margin: 30px auto;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .user-card {
            background-color: #ffffff;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            padding: 15px 20px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .user-card:hover {
            background-color: #f1f1f1;
            transform: translateY(-2px);
        }

        .user-card a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 18px;
        }

        .user-card a:hover {
            color: #007bff;
        }

        h2 {
            text-align: center;
            color: #555;
            margin-bottom: 20px;
        }
        .no-result-card {
            background-color: #f0f0f0;
            border: 1px dashed #ccc;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            color: #777;
            font-size: 18px;
            margin-top: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .no-result-card:hover {
            background-color: #e2e2e2;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<form th:action="@{/user/search-user}" method="get">
    <input type="text" name="name" placeholder="Search By Username" th:value="${name}">
    <button type="submit">Search</button>
    <a th:href="@{/user/home}">
        <button type="button" class="cancel-btn">Cancel</button>
    </a>
</form>
<div th:if="${randomFiveUser != null}" class="user-section">
    <h2>Suggested Users</h2>
    <div th:each="user : ${randomFiveUser}" class="user-card">
        <a th:href="@{/user/profile(userId=${user.id})}" th:text="${user.username}"></a>
    </div>
</div>
<div th:if="${userList != null}" class="user-section">
    <h2>Search Results</h2>
    <div th:if="${#lists.isEmpty(userList)}" class="no-result-card">
        <p>There is no result ! </p>
    </div>
    <div th:each="user : ${userList}" class="user-card">
        <a th:href="@{/user/profile(userId=${user.id})}" th:text="${user.username}"></a>
    </div>
</div>

</body>
</html>
