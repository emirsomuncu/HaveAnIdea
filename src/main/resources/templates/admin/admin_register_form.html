<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Registration Form</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e2e2e2, #c9d6ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-container {
            background: #fff;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 600px; /* geniş kart */
        }

        .form-container h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-container h5 {
            text-align: center;
            color: #e74c3c;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .form-group input {
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #4a69bd;
            box-shadow: 0 0 5px rgba(74, 105, 189, 0.5);
        }

        .form-group .text-danger {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .button-group button,
        .button-group a {
            display: inline-block;
            text-align: center;
            background: #4a69bd;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .button-group button:hover,
        .button-group a:hover {
            background: #3b5998;
        }

        .button-group a.btn-secondary {
            background: #6c757d;
        }

        .button-group a.btn-secondary:hover {
            background: #5a6268;
        }

        hr {
            border: 1px solid #ddd;
            margin: 40px 0;
        }

        @media (max-width: 600px) {
            .form-container {
                padding: 20px;
            }

            .form-group input {
                font-size: 14px;
            }

            .button-group button,
            .button-group a {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Admin Registration Form</h2>
    <h5>! The registered user will have admin privileges !</h5>
    <hr>

    <form action="#" th:action="@{/admin/save-admin}" th:object="${saveUserRequest}" method="post">

        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <input type="text" th:field="*{username}" placeholder="Username (*)">
            <span class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
        </div>

        <div class="form-group">
            <input type="text" th:field="*{email}" placeholder="Email (*)">
            <span class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div class="form-group">
            <input type="password" th:field="*{password}" placeholder="Password (*)">
            <span class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>

        <div class="form-group">
            <input type="password" th:field="*{confirmPassword}" placeholder="Confirm Password (*)">
            <span class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
        </div>

        <div class="button-group">
            <button type="submit">Register</button>
            <a th:href="@{/admin/home}" class="btn-secondary">Cancel</a>
        </div>

    </form>
</div>

</body>
</html>
