<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body {
            background-color: #f8f9fa;
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-card {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 12px;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        .form-card h2 {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 16px;
        }

        .btn-primary {
            background-color: #1da1f2;
            border: none;
            padding: 10px;
            font-size: 16px;
            border-radius: 10px;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #0d8ae6;
        }

        .btn-secondary {
            border-radius: 10px;
            padding: 10px;
            font-size: 16px;
        }

        .text-danger {
            font-size: 0.875em;
        }

        .alert {
            font-size: 0.95em;
        }

    </style>
</head>
<body>

<div class="main-container">
    <form action="#" th:action="@{/register/save-user}" th:object="${saveUserRequest}" method="post" class="form-card">

        <h2>User Registration</h2>

        <div th:if="${succes}" class="alert alert-success alert-dismissible fade show" role="alert">
            <strong>Account Created Successfully!</strong>
            <a th:href="@{/custom-login-page}" class="alert-link">Login Page</a>
        </div>

        <hr>

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <input type="text" th:field="*{username}" class="form-control" placeholder="Username (*)">
            <span class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
        </div>

        <div class="mb-3">
            <input type="text" th:field="*{email}" class="form-control" placeholder="Email (*)">
            <span class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div class="mb-3">
            <input type="password" th:field="*{password}" class="form-control" placeholder="Password (*)">
            <span class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>

        <div class="mb-3">
            <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Confirm Password (*)">
            <span class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">Register</button>
            <a th:href="@{/}" class="btn btn-secondary">Cancel</a>
        </div>

    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-cvK3QAQQKzX0K0FbBdZ8VViGrZ7f14hjLpU6ZbYVtHZc2sHtKZx5ccZjNuwx6FvN" crossorigin="anonymous"></script>
</body>
</html>
