<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e2e2e2, #c9d6ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-container {
            background: #fff;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        .top-right-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #ff4d4d;
            color: #fff;
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .top-right-button:hover {
            background-color: #e60000;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-header h2 {
            font-size: 28px;
            color: #333;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .profile-info div {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            background-color: #f7f9fc;
            border-radius: 8px;
            font-size: 16px;
        }

        .profile-info div span:first-child {
            font-weight: 600;
            color: #555;
        }

        .profile-info div span.value {
            font-weight: 500;
            color: #111;
        }

        .profile-actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .profile-actions a {
            display: inline-block;
            width: 100%;
            text-align: center;
            padding: 12px 0;
            background: #4a69bd;
            color: white;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        .profile-actions a:hover {
            background: #3b5998;
        }

        @media (max-width: 600px) {
            .profile-container {
                padding: 20px;
            }

            .profile-header h2 {
                font-size: 24px;
            }

            .profile-info div {
                font-size: 14px;
            }

            .profile-actions a {
                padding: 10px 0;
            }
        }
    </style>
</head>
<body>

<div class="profile-container">
    <div th:if="${getUserByIdResponse.id} == ${currentUser.get().id}">
        <a th:href="@{/user/delete-account(userId=${currentUser.get().id})}" class="top-right-button">Delete</a>
    </div>

    <div class="profile-header">
        <h2>Welcome</h2>
    </div>

    <div class="profile-info">
        <div>
            <span>Username:</span>
            <span class="value" th:text="${getUserByIdResponse.username}"></span>
        </div>
        <div>
            <span>Email:</span>
            <span class="value" th:text="${getUserByIdResponse.email}"></span>
        </div>
        <div>
            <span>Role:</span>
            <span class="value" th:text="${getUserByIdResponse.role}"></span>
        </div>
    </div>

    <div class="profile-actions">
        <a th:href="@{/user/user-posts(userId=${getUserByIdResponse.id})}">See Posts</a>
        <a th:href="@{/user/user-comments(userId=${getUserByIdResponse.id})}">See Comments</a>

        <div th:if="${getUserByIdResponse.id} == ${currentUser.get().id}">
            <a th:href="@{/user/update-profile(userId=${currentUser.get().id})}">Update Profile</a>
        </div>

        <a th:href="@{/user/home}">Back To Home</a>
    </div>
</div>

</body>
</html>
