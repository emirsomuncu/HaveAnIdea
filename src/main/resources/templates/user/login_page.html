<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body {
            background-color: #f8f9fa;
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-card {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 12px;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        .form-card h3 {
            font-size: 26px;
            font-weight: bold;
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 16px;
        }

        .btn-primary {
            background-color: #1da1f2;
            border: none;
            padding: 10px;
            font-size: 16px;
            border-radius: 10px;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #0d8ae6;
        }

        .btn-secondary {
            border-radius: 10px;
            padding: 10px;
            font-size: 16px;
        }

        .text-danger, .text-success {
            text-align: center;
            font-size: 0.95em;
            margin-bottom: 10px;
        }

        .alert {
            font-size: 0.95em;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="form-card">

        <h3>Login</h3>

        <form th:action="@{/authenticate-user}" method="post">

            <div th:if="${param.error}" class="alert alert-danger">
                Sorry! Your Email-Password duo does not match.
            </div>

            <div th:if="${param.logout}" class="alert alert-success">
                You have been logged out.
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="text" name="username" class="form-control" placeholder="Enter your email" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required />
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">Login</button>
            </div>

        </form>

        <hr>

        <h6 class="text-center">If you are not registered, please register to continue:</h6>
        <div class="d-grid gap-2">
            <a th:href="@{/register}" class="btn btn-secondary">Register</a>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-cvK3QAQQKzX0K0FbBdZ8VViGrZ7f14hjLpU6ZbYVtHZc2sHtKZx5ccZjNuwx6FvN" crossorigin="anonymous"></script>
</body>
</html>
