<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Likes</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wrapper {
            background: #fff;
            width: 90%;
            max-width: 500px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            padding: 30px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .container::-webkit-scrollbar {
            width: 8px;
        }

        .container::-webkit-scrollbar-thumb {
            background-color: #888;
            border-radius: 10px;
        }

        .container::-webkit-scrollbar-thumb:hover {
            background-color: #555;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-weight: 700;
        }

        hr {
            border: none;
            height: 2px;
            background: linear-gradient(to right, #74ebd5, #acb6e5);
            margin: 10px 0 20px;
        }

        a {
            display: block;
            padding: 12px 20px;
            margin-bottom: 10px;
            background: #f1f1f1;
            border-radius: 12px;
            color: #333;
            font-size: 16px;
            font-weight: 500;
            transition: background 0.3s, transform 0.3s;
            text-decoration: none;
        }

        a:hover {
            background: #d4e0f0;
            transform: translateX(5px);
            color: #1a1a1a;
        }

        p {
            margin: 0;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="container">
        <h2>LIKES</h2>
        <hr>
        <div th:each="like : ${likeList}">
            <a th:href="@{/user/profile(userId=${like.userId})}">
                <p th:text="${like.userUsername}"></p>
            </a>
        </div>
    </div>
</div>
</body>
</html>
